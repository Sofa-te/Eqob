<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EqubFlow — Equb Management</title>
<meta name="theme-color" content="#0b0f19">
<style>
:root{--bg:#080b12;--panel:#101521;--panel2:#151b29;--line:#232c3d;--text:#eef3fb;--muted:#8e9ab0;--accent:#7c5cff;--accent2:#20d6a1;--warn:#f7b955;--danger:#ff6678;--shadow:0 18px 50px rgba(0,0,0,.28);--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(32,214,161,.08),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.sidebar{width:260px;background:rgba(10,14,23,.92);border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20;backdrop-filter:blur(18px);transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9d87ff);font-weight:900;box-shadow:0 10px 30px rgba(124,92,255,.3)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb9cc;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#171d2b;color:#fff}.nav .ico{width:22px;text-align:center}.sidebar-foot{position:absolute;bottom:18px;left:18px;right:18px}.user-mini{border:1px solid var(--line);background:#0e141f;padding:12px;border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#20283a;color:#fff;font-weight:800}.main{margin-left:0;width:100%;min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(8,11,18,.78);backdrop-filter:blur(18px);z-index:10}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:#121925;color:#eaf0f8;border-radius:12px;padding:10px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:linear-gradient(135deg,var(--accent),#6546e9);border-color:transparent}.btn.success{background:rgba(32,214,161,.13);color:#5ff0c5;border-color:rgba(32,214,161,.3)}.btn.danger{background:rgba(255,102,120,.12);color:#ff8796;border-color:rgba(255,102,120,.28)}.btn.warn{background:rgba(247,185,85,.12);color:#ffd27c;border-color:rgba(247,185,85,.25)}.content{padding:28px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:#9d87ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}.hero h2{font-size:30px;line-height:1.15;margin:6px 0}.hero p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(18,24,37,.96),rgba(12,17,27,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat{min-height:125px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:30px;font-weight:850;margin:10px 0 4px}.stat .sub{color:#7e8aa0;font-size:12px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #202838;text-align:left;white-space:nowrap}.table th{color:#7f8ba0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.paid{background:rgba(32,214,161,.11);color:#5ff0c5}.pending{background:rgba(247,185,85,.1);color:#ffd27c}.rejected{background:rgba(255,102,120,.1);color:#ff8796}.neutral{background:#1b2331;color:#aab5c7}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#8d99ad}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0b111b;color:#f2f6fc;border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e55dd;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.search{flex:1;min-width:180px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.notice-list{display:grid;gap:10px}.notice{border:1px solid var(--line);background:#0d131e;padding:13px;border-radius:14px}.notice.unread{border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.06)}.notice b{display:block}.notice small{color:var(--muted)}.drawbox{text-align:center;padding:34px;border-radius:20px;background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.22),transparent 55%),#0c121d;border:1px solid var(--line)}.drawnum{font-size:82px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:18px}.winner{font-size:20px;color:#5ff0c5;font-weight:850}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 20% 10%,rgba(124,92,255,.2),transparent 65%),var(--bg)}.login-card{width:min(470px,100%);padding:30px;border:1px solid var(--line);background:rgba(15,21,33,.94);border-radius:26px;box-shadow:var(--shadow)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.demo-switch{display:flex;gap:8px;background:#0a1019;padding:5px;border:1px solid var(--line);border-radius:13px;margin:14px 0}.demo-switch button{flex:1;background:transparent;color:#8d99ad;padding:9px;border-radius:9px}.demo-switch button.active{background:#1b2231;color:#fff}.login-note{color:#7e8aa0;font-size:12px;margin-top:14px}.mobile-menu{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;place-items:center;padding:18px}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#101621;border:1px solid var(--line);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.slip-preview{width:100%;max-height:360px;object-fit:contain;background:#080b12;border-radius:12px;border:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#151d2b;border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 16px;border-radius:13px;max-width:340px}.toast b{display:block}.menu-toggle{display:block}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menu-toggle{display:block}.topbar{padding:0 16px}.content{padding:18px}}
@media(max-width:620px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}.topbar h1{font-size:17px}.content{padding:14px}.card{padding:15px}.drawnum{font-size:62px}}

/* ===== V2 MODERN UX ===== */
:root{--success:#20d6a1;--glass:rgba(255,255,255,.035)}
body.light{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fc;--line:#dce3ee;--text:#172033;--muted:#667085;--shadow:0 14px 35px rgba(35,48,75,.10);background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.10),transparent 60%),#f4f7fb}
body.light .sidebar,body.light .topbar{background:rgba(255,255,255,.88)}
body.light .card{background:linear-gradient(180deg,#fff,#f9fbfe)}
body.light .field input,body.light .field select,body.light .field textarea{background:#fff;color:var(--text)}
body.light .table th,body.light .table td{border-color:#e8edf4}
body.light .notice{background:#f8fafd}
body.light .drawbox{background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.12),transparent 55%),#f8faff}
body.light .nav button{color:#667085}
body.light .nav button:hover,body.light .nav button.active{background:#eef1f8;color:#172033}
.theme-icon{font-size:17px}
.sidebar{transition:transform .22s ease}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.money-card{position:relative;overflow:hidden}
.money-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:rgba(124,92,255,.10)}
.money-card .num{font-size:28px}
.financial-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.progress{height:7px;background:#1d2636;border-radius:99px;overflow:hidden;margin-top:10px}
body.light .progress{background:#e7ecf4}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:99px}
.locked{opacity:.62}
.locked-badge{color:#ff8796;background:rgba(255,102,120,.10);border:1px solid rgba(255,102,120,.2);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.winner-list{display:grid;gap:9px}
.winner-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.menu-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:15px 12px 5px}
@media(max-width:1050px){.financial-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.financial-grid{grid-template-columns:1fr}}

body.amharic{font-family:"Noto Sans Ethiopic","Noto Sans",Arial,sans-serif}
body.amharic .num,body.amharic input[type=number]{font-family:Arial,"Noto Sans Ethiopic",sans-serif}
body.amharic .eyebrow{letter-spacing:.03em}
/* ===== V6 BUTTON POLISH ===== */
.btn,.iconbtn,.nav button,.demo-switch button,.gallery-btn{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}
.btn{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:rgba(255,255,255,.10);box-shadow:0 7px 18px rgba(37,99,235,.18);font-weight:700}
.btn:hover,.iconbtn:hover,.gallery-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,99,235,.22)}
.btn:active,.iconbtn:active,.gallery-btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 7px 20px rgba(109,40,217,.22)}
.btn.success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(5,150,105,.20)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(220,38,38,.20)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-color:transparent;box-shadow:0 7px 20px rgba(217,119,6,.20)}
.iconbtn{background:linear-gradient(135deg,#334155,#1e293b);color:#fff;border-color:#475569;box-shadow:0 6px 16px rgba(15,23,42,.18)}
 .menu-toggle{width:46px;height:46px;padding:0;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.menu-toggle svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.menu-toggle:hover svg{transform:scale(1.06)}
.menu-toggle:focus-visible{outline:3px solid rgba(124,92,255,.25);outline-offset:2px}

#notificationBtn{background:linear-gradient(135deg,#06b6d4,#0284c7);border-color:transparent}
#notificationBtn:hover{box-shadow:0 10px 24px rgba(2,132,199,.25)}
.nav button{border:1px solid transparent}
.nav button:hover{transform:translateX(2px);background:linear-gradient(90deg,rgba(124,92,255,.16),rgba(59,130,246,.08));border-color:rgba(124,92,255,.20)}
.nav button.active{background:linear-gradient(90deg,rgba(124,92,255,.24),rgba(59,130,246,.12));border-color:rgba(124,92,255,.28);box-shadow:inset 3px 0 0 #8b5cf6}
.sidebar-tools{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.sidebar-tool{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#1e293b,#111827);color:#fff;font-weight:700}
.sidebar-tool.lang-tool{background:linear-gradient(135deg,#7c3aed,#5b21b6);border-color:transparent}
.sidebar-tool.theme-tool{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:transparent}
.sidebar-tool:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(0,0,0,.18)}
.gallery-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;border:1px solid transparent;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(37,99,235,.18)}
.gallery-input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
body.light .btn{color:#fff}
body.light .iconbtn{background:linear-gradient(135deg,#334155,#1e293b);color:#fff;border-color:#64748b}
body.light .sidebar-tool{color:#fff}
body.light .nav button.active{background:linear-gradient(90deg,#ede9fe,#eff6ff);color:#172033;border-color:#ddd6fe}
body.light .nav button:hover{background:#f1f5f9;color:#172033}
.lang-btn{min-width:92px}


/* ===== V9 NAV + NOTIFICATION + ADMIN CHAT ===== */
.nav .ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(124,92,255,.10);color:var(--text);flex:0 0 34px;transition:.18s ease}
.nav .ico svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover .ico{background:rgba(124,92,255,.18);color:#7c5cff;transform:scale(1.04)}
.nav button.active .ico{background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff;box-shadow:0 5px 14px rgba(99,72,210,.25)}
body.light .nav .ico{background:#f1f5ff;color:#334155}
body.light .nav button:hover .ico{background:#e0e7ff;color:#4f46e5}
body.light .nav button.active .ico{background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff}
.notif-count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--bg);line-height:1}
#notificationBtn{position:relative}
.chat-shell{display:grid;grid-template-columns:250px 1fr;gap:16px;min-height:520px}
.chat-people{border:1px solid var(--line);border-radius:18px;background:var(--glass);padding:12px}
.chat-person{width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--text);padding:13px;border-radius:13px;display:flex;align-items:center;gap:10px}
.chat-person.active{background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(59,130,246,.08));border-color:rgba(124,92,255,.35)}
.chat-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#2563eb);color:#fff;font-weight:900}
.chat-main{border:1px solid var(--line);border-radius:18px;background:var(--glass);display:flex;flex-direction:column;overflow:hidden}
.chat-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.chat-messages{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:360px;max-height:470px;overflow:auto}
.chat-msg{max-width:min(78%,520px);padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:var(--panel2)}
.chat-msg.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(59,130,246,.15));border-color:rgba(124,92,255,.32)}
.chat-msg small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.chat-compose{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}
.chat-compose input{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:11px 13px;outline:none}
.chat-note{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:700px){.chat-shell{grid-template-columns:1fr}.chat-people{min-height:auto}.chat-main{min-height:500px}.chat-messages{min-height:330px}}

/* ===== FINAL BUTTON VISIBILITY / LIGHT MODE FIX ===== */
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;font-weight:800;letter-spacing:.01em;color:#fff!important;background:linear-gradient(135deg,#475569,#334155)!important;border:1px solid rgba(255,255,255,.16)!important}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9)!important;color:#fff!important}
.btn.success{background:linear-gradient(135deg,#10b981,#047857)!important;color:#fff!important}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)!important;color:#fff!important}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#c2410c)!important;color:#fff!important}
.btn.info{background:linear-gradient(135deg,#06b6d4,#0369a1)!important;color:#fff!important}
.btn.secondary{background:linear-gradient(135deg,#64748b,#475569)!important;color:#fff!important}

/* In Light Mode, buttons stay clearly visible but use dark/black lettering. */
body.light .btn{color:#111827!important;border-color:rgba(15,23,42,.10)!important}
body.light .btn:not(.primary):not(.success):not(.danger):not(.warn):not(.info):not(.secondary){background:linear-gradient(135deg,#e2e8f0,#cbd5e1)!important}
body.light .btn.primary{background:linear-gradient(135deg,#ddd6fe,#c4b5fd)!important}
body.light .btn.success{background:linear-gradient(135deg,#bbf7d0,#86efac)!important}
body.light .btn.danger{background:linear-gradient(135deg,#fecaca,#fca5a5)!important}
body.light .btn.warn{background:linear-gradient(135deg,#fed7aa,#fdba74)!important}
body.light .btn.info{background:linear-gradient(135deg,#bae6fd,#7dd3fc)!important}
body.light .btn.secondary{background:linear-gradient(135deg,#cbd5e1,#94a3b8)!important}
body.light .iconbtn{color:#111827!important}
body.light #notificationBtn{color:#fff!important;background:linear-gradient(135deg,#06b6d4,#0284c7)!important}
body.light .gallery-btn{color:#fff!important}

/* Login role buttons are also visually distinct. */
.demo-switch button{font-weight:800}
.demo-switch button.active{background:linear-gradient(135deg,#ddd6fe,#c4b5fd)!important;color:#111827!important}

/* Disabled buttons remain readable instead of becoming blank white blocks. */
.btn:disabled,.iconbtn:disabled{opacity:.52;cursor:not-allowed;transform:none!important;box-shadow:none!important}

</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand"><div class="logo">E</div><div><b>EqubFlow</b><small>Equb Management</small></div></div>
    <div class="eyebrow">Equb Management</div>
    <h2 style="margin:5px 0">Sign in to continue</h2>
    <p style="color:var(--muted)">No Firebase yet. Everything in this prototype is stored locally in this browser.</p>
    <div class="demo-switch"><button id="adminTab" class="active" onclick="setLoginRole('admin')">Super Admin</button><button id="managerTab" onclick="setLoginRole('manager')">Admin</button><button id="userTab" onclick="setLoginRole('user')">Member</button></div>
    <div id="loginForm"></div>
    <div class="login-note">Sign in to manage your Equb account.</div>
  </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo">E</div><div><b>EqubFlow</b><small id="brandSub">Super Admin</small></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-tools">
      <button id="sidebarLangBtn" class="sidebar-tool lang-tool" onclick="toggleLanguage()"><span id="sidebarLangText">አማርኛ</span></button>
      <button id="sidebarThemeBtn" class="sidebar-tool theme-tool" onclick="toggleTheme()"><span id="sidebarThemeText">ብርሃን ሁነታ</span></button>
    </div>
    <div class="sidebar-foot"><div class="user-mini"><div class="avatar" id="miniAvatar">SA</div><div><b id="miniName">Super Admin</b><small id="miniRole" style="display:block;color:var(--muted)">Administrator</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn menu-toggle" aria-label="Menu" title="Menu" onclick="toggleSidebar()"><span id="menuIcon"></span></button><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button id="notificationBtn" class="iconbtn" title="Notifications" aria-label="Notifications" onclick="showNotifications()"><span id="notificationIcon"></span><span id="notifDot"></span></button><button class="btn danger" onclick="logout()">Logout</button></div></header>
    <section id="content" class="content"></section>

function trText(s){return AM[s]||s}

function translateVisibleUI(){
 if((db.settings.lang||'en')!=='am')return;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()) nodes.push(walker.currentNode);
 const pairs=Object.entries(AM).sort((a,b)=>b[0].length-a[0].length);
 const fragments=[['Cycle #','ዙር #'],['Week #','ሳምንት #'],['Submitted ','ቀርቧል '],[' · Cycle #',' · ዙር #'],['Cycle #','ዙር #'],['Maximum ','ከፍተኛው '],['Confirmed ','የተረጋገጠ '],['Pending ','በመጠባበቅ ላይ '],['Locked until Equb end','እቁቡ እስኪያልቅ ድረስ ተከልክሏል'],['Winner: ','አሸናፊ፦ '],[' for Cycle #',' ለዙር #']];
 nodes.forEach(n=>{
   let v=n.nodeValue;
   const t=v.trim();
   if(AM[t]) v=v.replace(t,AM[t]);
   else { for(const [a,b] of pairs) if(v.includes(a)) v=v.split(a).join(b); for(const [a,b] of fragments) if(v.includes(a)) v=v.split(a).join(b); }
   n.nodeValue=v;
 });
 document.querySelectorAll('input[placeholder],button[title],option').forEach(el=>{
   if(el.placeholder && AM[el.placeholder]) el.placeholder=AM[el.placeholder];
   if(el.title && AM[el.title]) el.title=AM[el.title];
   const t=(el.textContent||'').trim(); if(AM[t]) el.textContent=AM[t];
 });
}

function applyLanguage(){
  const lang=db.settings.lang||'en';
  document.body.classList.toggle('amharic',lang==='am');
  document.documentElement.lang=lang==='am'?'am':'en';
  document.documentElement.dir='ltr';
  const b=document.getElementById('sidebarLangText');
  if(b)b.textContent=lang==='am'?'English':'አማርኛ';
  const themeText=document.getElementById('sidebarThemeText');
  if(themeText){ const light=db.settings.theme==='light'; themeText.textContent=lang==='am'?(light?'ጨለማ ሁነታ':'ብርሃን ሁነታ'):(light?'Dark mode':'Light mode'); }
  const themeBtn=document.getElementById('sidebarThemeBtn');
  
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=lang==='am'?trText(el.dataset.i18n):el.dataset.i18n}); if(lang==='am') setTimeout(translateVisibleUI,0);
}
function toggleLanguage(){
  db.settings.lang=(db.settings.lang||'en')==='en'?'am':'en';
  save(); render(); applyLanguage();
}

function applyTheme(){
  const t=db.settings.theme||'dark';
  document.body.classList.toggle('light',t==='light');
  const icon=document.getElementById('themeIcon'); if(icon) icon.textContent=t==='light'?'☀':'☾';
}
function toggleTheme(){
  db.settings.theme=(db.settings.theme||'dark')==='dark'?'light':'dark';
  save(); applyTheme(); applyLanguage();
}
function activeMembers(){return db.members.filter(m=>m.active)}
function cyclePayments(){return db.payments.filter(p=>p.cycle===db.settings.cycle)}
function confirmedTotal(){return cyclePayments().filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function allConfirmedTotal(){return db.payments.filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function expectedTotal(){return activeMembers().length*Number(db.settings.weeklyAmount||0)}
function pendingTotal(){return cyclePayments().filter(p=>p.status==='pending').reduce((a,p)=>a+Number(p.amount||0),0)}
function winnerLocked(id){return (db.draws||[]).some(d=>d.memberId===id && d.lockedUntilEqubEnd)}
function currentCycleDraw(){return (db.draws||[]).find(d=>d.cycle===db.settings.cycle);}
function eligibleDrawMembers(){
  return activeMembers().filter(m=>paymentFor(m.id)?.status==='paid'&&!winnerLocked(m.id));
}
function drawLockedWinners(){

 <div class="field"><label>ቋንቋ / Language</label><select id="slang"><option value="en" ${db.settings.lang!=='am'?'selected':''}>English</option><option value="am" ${db.settings.lang==='am'?'selected':''}>አማርኛ</option></select></div><div class="field"><label>Equb status</label><select id="sstatus"><option value="active" ${db.settings.equbStatus==='active'?'selected':''}>Active</option><option value="ended" ${db.settings.equbStatus==='ended'?'selected':''}>Ended</option></select></div>
 </div><div style="display:flex;gap:8px;margin-top:15px;flex-wrap:wrap"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn success" onclick="startNewEqub()">↻ Start New Equb / Clear winner locks</button></div></div>
 <div class="card" style="margin-top:16px"><div class="section-head"><h3>Rules currently active</h3></div><div class="notice-list"><div class="notice"><b>💰 Confirmed money only</b><div>Dashboard balance counts only payments confirmed by Super Admin.</div></div><div class="notice"><b>🎰 No-repeat draw</b><div>A draw winner is locked and cannot enter another draw until the Equb ends.</div></div><div class="notice"><b>🔔 Notifications</b><div>Admin receives new-slip notifications; members receive confirm/reject/draw notifications.</div></div></div></div>`;
}
function userData(){return member(session.id)}
function page_userDashboard(){const m=userData(),p=paymentFor(m.id),winner=currentCycleDraw();return `<div class="hero"><div><div class="eyebrow">${esc(db.settings.org)} · Member ${m.id}</div><h2>Welcome, ${esc(m.name.split(' ')[0])} 👋</h2><p>Your weekly Equb account at a glance.</p></div><button class="btn primary" onclick="go('myPayment')">${p?.status==='paid'?'View payment':'Pay this week'} →</button></div><div class="card" style="margin-bottom:16px"><div class="section-head"><h3>This week's winner</h3><span class="badge neutral">Cycle #${db.settings.cycle}</span></div>${winner?`<div class="winner-row"><span><b>🏆 ${esc(winner.name)}</b><small style="display:block;color:var(--muted)">Member ${winner.memberId}</small></span><span class="locked-badge">WINNER</span></div>`:'<div class="empty">No winner yet for this week.</div>'}</div><div class="grid stats"><div class="card stat"><span class="label">Weekly contribution</span><div class="num">${money(db.settings.weeklyAmount)}</div><span class="sub">Cycle #${db.settings.cycle}</span></div><div class="card stat"><span class="label">Current status</span><div class="num" style="font-size:21px;margin-top:16px">${statusBadge(p?.status||'none')}</div><span class="sub">${p?'Submitted '+new Date(p.submittedAt).toLocaleDateString():'No payment submitted'}</span></div><div class="card stat"><span class="label">Paid cycles</span><div class="num">${db.payments.filter(x=>x.memberId===m.id&&x.status==='paid').length}</div><span class="sub">Confirmed payments</span></div><div class="card stat"><span class="label">Notifications</span><div class="num">${db.notifications.filter(n=>n.target===m.id&&!n.read).length}</div><span class="sub">Unread updates</span></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><h3>This week's payment</h3></div>${userPaymentCard(p)}</div><div class="card"><div class="section-head"><h3>Recent updates</h3></div>${noticeRows(4,m.id)}</div></div>`}
function userPaymentCard(p){if(!p)return `<div class="empty">Your Week #${db.settings.cycle} contribution is ${money(db.settings.weeklyAmount)}.<br><button class="btn primary" style="margin-top:12px" onclick="go('myPayment')">Submit payment</button></div>`;return `<div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><b>Cycle #${p.cycle}</b><div style="color:var(--muted);margin-top:4px">${money(p.amount)} · ${p.bank||'Bank'}</div></div>${statusBadge(p.status)}</div><div style="margin-top:15px">${p.status==='rejected'?`<div class="notice"><b>Payment rejected</b><div>${esc(p.reason||'Please upload a new slip.')}</div></div><button class="btn primary" style="margin-top:12px" onclick="go('myPayment')">Upload new slip</button>`:p.status==='pending'?'<div class="notice">Your slip is waiting for Super Admin verification.</div>':'<div class="notice">Your payment has been confirmed. Thank you.</div>'}</div>`}
function page_myPayment(){const p=paymentFor(session.id);return `<div class="hero"><div><div class="eyebrow">Weekly contribution</div><h2>Payment for Cycle #${db.settings.cycle}</h2><p>Amount due: <b>${money(db.settings.weeklyAmount)}</b> · Deadline: ${esc(db.settings.due)}</p></div></div><div class="card">${p&&p.status==='paid'?`<div class="empty" style="color:#5ff0c5">✓ Payment already confirmed for this cycle.</div>`:paymentForm(p)}</div>`}
function paymentForm(p){return `<div class="formgrid"><div class="field"><label>Amount (ETB)</label><input id="pamount" type="number" value="${p?.amount||db.settings.weeklyAmount}"></div><div class="field"><label>Bank</label><select id="pbank"><option>Commercial Bank of Ethiopia</option><option>Awash Bank</option><option>Dashen Bank</option><option>Bank of Abyssinia</option><option>Other</option></select></div><div class="field"><label>Transaction / reference number</label><input id="pref" placeholder="e.g. TRX-123456"></div><div class="field"><label>Payment date</label><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field" style="margin-top:12px"><label>Bank payment slip (image)</label><label class="gallery-btn" for="pslip">🖼️ <span data-i18n="Gallery">Gallery</span></label><input id="pslip" class="gallery-input" type="file" accept="image/*" onchange="previewSlip(event)"></div><div id="slipPreview" style="margin-top:12px"></div><button class="btn primary" style="margin-top:15px" onclick="submitPayment()">Submit payment for verification</button>`}
function page_history(){const ps=db.payments.filter(p=>p.memberId===session.id);return `<div class="hero"><div><div class="eyebrow">My records</div><h2>Payment History</h2><p>Only your own payment records are shown.</p></div></div><div class="card">${ps.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Cycle</th><th>Amount</th><th>Bank</th><th>Reference</th><th>Status</th></tr></thead><tbody>${ps.map(p=>`<tr><td>#${p.cycle}</td><td>${money(p.amount)}</td><td>${esc(p.bank||'-')}</td><td>${esc(p.ref||'-')}</td><td>${statusBadge(p.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payment history yet.</div>'}</div>`}
function page_profile(){const m=userData();return `<div class="hero"><div><div class="eyebrow">Account</div><h2>My Profile</h2><p>Your member information.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Member ID</label><input value="${esc(m.id)}" disabled></div><div class="field"><label>Full name</label><input value="${esc(m.name)}" disabled></div><div class="field"><label>Phone</label><input value="${esc(m.phone)}" disabled></div><div class="field"><label>Status</label><input value="${m.active?'Active':'Inactive'}" disabled></div></div></div>`}

function memberModal(id){const m=id?member(id):{id:'',name:'',phone:'',active:true};openModal(`<div class="modal-head"><h3>${id?'Edit member':'Add member'}</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Member ID</label><input id="mid" value="${esc(m.id)}" ${id?'disabled':''} placeholder="M013"></div><div class="field"><label>Full name</label><input id="mname" value="${esc(m.name)}"></div><div class="field"><label>Phone</label><input id="mphone" value="${esc(m.phone)}"></div><div class="field"><label>Status</label><select id="mactive"><option value="true" ${m.active?'selected':''}>Active</option><option value="false" ${!m.active?'selected':''}>Inactive</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="saveMember('${id||''}')">Save member</button>`)}
function saveMember(id){const data={id:(document.getElementById('mid').value||'M'+String(db.members.length+1).padStart(3,'0')).toUpperCase(),name:document.getElementById('mname').value.trim(),phone:document.getElementById('mphone').value.trim(),active:document.getElementById('mactive').value==='true'};if(!data.name)return toast('Missing name','Enter the member name.');if(!id){if(db.members.length>=100)return toast('Limit reached','Maximum is 100 members.');db.members.push(data)}else Object.assign(member(id),data,{id});save();closeModal();render();toast('Saved','Member updated.')}
function submitPayment(){const m=userData(),amount=Number(document.getElementById('pamount').value),bank=document.getElementById('pbank').value,ref=document.getElementById('pref').value.trim(),date=document.getElementById('pdate').value,file=document.getElementById('pslip').files[0];if(!amount||!ref||!date)return toast('Incomplete','Please complete amount, reference and date.');if(!file)return toast('Slip required','Please select the bank slip image.');if(file.size>2*1024*1024)return toast('File too large','For this local prototype use an image under 2MB.');const reader=new FileReader();reader.onload=()=>{const old=paymentFor(m.id);if(old)db.payments=db.payments.filter(x=>x.id!==old.id);const p={id:'P'+Date.now(),memberId:m.id,cycle:db.settings.cycle,amount,bank,ref,paidAt:new Date(date).getTime(),submittedAt:Date.now(),status:'pending',slipData:reader.result};db.payments.unshift(p);addNotif('superadmin','New Payment Slip',m.name+' submitted a payment slip for '+money(amount)+'.');save();go('userDashboard');toast('Submitted','Your payment is waiting for verification.')};reader.readAsDataURL(file)}
function previewSlip(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById('slipPreview').innerHTML=`<img class="slip-preview" src="${r.result}" alt="Payment slip preview">`;r.readAsDataURL(f)}
function openPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;const m=member(p.memberId);openModal(`<div class="modal-head"><h3>Payment Review</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="grid two"><div><div class="notice"><b>${esc(m?.name||p.memberId)}</b><div>${p.memberId} · Cycle #${p.cycle}</div><div>${money(p.amount)} · ${esc(p.bank||'-')}</div><div>Ref: ${esc(p.ref||'-')}</div><div>Status: ${statusBadge(p.status)}</div></div>${p.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn success" onclick="verifyPayment('${p.id}')">✓ Confirm</button><button class="btn danger" onclick="rejectPayment('${p.id}')">✕ Reject</button></div>`:''}</div><div>${p.slipData?`<img class="slip-preview" src="${p.slipData}" alt="Bank slip">`:'<div class="empty">No real slip image in this record.</div>'}</div></div>`)}
function verifyPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;p.status='paid';p.verifiedAt=Date.now();p.verifiedBy='ADMIN';addNotif(p.memberId,'Payment Confirmed','Your payment for Cycle #'+p.cycle+' has been confirmed.','success');save();closeModal();render();toast('Confirmed','Member is now Paid.')}
function rejectPayment(id){const reason=prompt('Reason for rejection:','Slip could not be verified.');if(reason===null)return;const p=db.payments.find(x=>x.id===id);if(!p)return;p.status='rejected';p.reason=reason||'Please upload a new slip.';addNotif(p.memberId,'Payment Rejected',p.reason,'danger');save();closeModal();render();toast('Rejected','Member was notified to upload again.')}
function runDraw(){
 checkEqubEnd();
 if(db.settings.equbStatus!=='active')return toast('Equb ended','Start a new Equb before running another draw.');
 if(currentCycleDraw())return toast('Draw already completed','Only one draw is allowed for the current cycle.');
 const eligible=eligibleDrawMembers();
 if(!eligible.length)return toast('No eligible members','Only Paid members who have never won in this Equb can be selected.');
 const num=document.getElementById('drawNum'),win=document.getElementById('drawWinner');
 let i=0;
 const timer=setInterval(()=>{
   num.textContent=String(Math.floor(Math.random()*100)+1).padStart(2,'0');
   if(++i>24){
     clearInterval(timer);
     const arr=new Uint32Array(1); crypto.getRandomValues(arr);
     const m=eligible[arr[0]%eligible.length];
     num.textContent=m.id.replace('M','');
     win.textContent='🏆 '+m.name+' — '+m.id;
     db.draws.unshift({memberId:m.id,name:m.name,cycle:db.settings.cycle,at:now(),lockedUntilEqubEnd:true});
     addNotif('superadmin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+db.settings.cycle+'. Winner is locked until the Equb ends.','success');
     addNotif(m.id,'You won the Equb draw','Congratulations! You won today’s draw. You are locked from future draws until this Equb ends.','success');
     save();
     toast('Draw complete',m.name+' is now the winner for this week and cannot be selected again in this Equb.');
     setTimeout(render,500);
   }
 },75);
}
function readNotif(id){const n=db.notifications.find(x=>x.id===id);if(n)n.read=true;save();render()}
function markAllRead(){db.notifications.filter(n=>n.target===(notificationTarget())).forEach(n=>n.read=true);save();render()}
function showNotifications(){go('notifications')}
function saveSettings(){db.settings.org=document.getElementById('sorg').value.trim()||'Unity Equb';db.settings.weeklyAmount=Number(document.getElementById('samt').value)||1000;db.settings.cycle=Number(document.getElementById('scycle').value)||1;db.settings.due=document.getElementById('sdue').value.trim()||'Friday';db.settings.equbEndDate=document.getElementById('send').value||'';db.settings.equbStatus=document.getElementById('sstatus').value;db.settings.lang=document.getElementById('slang').value;save();checkEqubEnd();applyTheme();render();toast('Saved','Settings updated locally.')}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
renderLoginForm();
applyLanguage();
</script>
</body>
</html>
