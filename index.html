<style>
:root{--bg:#080b12;--panel:#101521;--panel2:#151b29;--line:#232c3d;--text:#eef3fb;--muted:#8e9ab0;--accent:#7c5cff;--accent2:#20d6a1;--warn:#f7b955;--danger:#ff6678;--shadow:0 18px 50px rgba(0,0,0,.28);--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(32,214,161,.08),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.sidebar{width:260px;background:rgba(10,14,23,.92);border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20;backdrop-filter:blur(18px);transform:translateX(-100%)} .sidebar.open{transform:translateX(0)}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9d87ff);font-weight:900;box-shadow:0 10px 30px rgba(124,92,255,.3)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb9cc;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#171d2b;color:#fff}.nav .ico{width:22px;text-align:center}.sidebar-foot{position:absolute;bottom:18px;left:18px;right:18px}.user-mini{border:1px solid var(--line);background:#0e141f;padding:12px;border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#20283a;color:#fff;font-weight:800}.main{margin-left:0;width:100%;min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(8,11,18,.78);backdrop-filter:blur(18px);z-index:10}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:#121925;color:#eaf0f8;border-radius:12px;padding:10px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:linear-gradient(135deg,var(--accent),#6546e9);border-color:transparent}.btn.success{background:rgba(32,214,161,.13);color:#5ff0c5;border-color:rgba(32,214,161,.3)}.btn.danger{background:rgba(255,102,120,.12);color:#ff8796;border-color:rgba(255,102,120,.28)}.btn.warn{background:rgba(247,185,85,.12);color:#ffd27c;border-color:rgba(247,185,85,.25)}.content{padding:28px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:#9d87ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}.hero h2{font-size:30px;line-height:1.15;margin:6px 0}.hero p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(18,24,37,.96),rgba(12,17,27,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat{min-height:125px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:30px;font-weight:850;margin:10px 0 4px}.stat .sub{color:#7e8aa0;font-size:12px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #202838;text-align:left;white-space:nowrap}.table th{color:#7f8ba0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.paid{background:rgba(32,214,161,.11);color:#5ff0c5}.pending{background:rgba(247,185,85,.1);color:#ffd27c}.rejected{background:rgba(255,102,120,.1);color:#ff8796}.neutral{background:#1b2331;color:#aab5c7}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#8d99ad}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0b111b;color:#f2f6fc;border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e55dd;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.search{flex:1;min-width:180px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.notice-list{display:grid;gap:10px}.notice{border:1px solid var(--line);background:#0d131e;padding:13px;border-radius:14px}.notice.unread{border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.06)}.notice b{display:block}.notice small{color:var(--muted)}.drawbox{text-align:center;padding:34px;border-radius:20px;background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.22),transparent 55%),#0c121d;border:1px solid var(--line)}.drawnum{font-size:82px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:18px}.winner{font-size:20px;color:#5ff0c5;font-weight:850}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 20% 10%,rgba(124,92,255,.2),transparent 65%),var(--bg)}.login-card{width:min(470px,100%);padding:30px;border:1px solid var(--line);background:rgba(15,21,33,.94);border-radius:26px;box-shadow:var(--shadow)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.demo-switch{display:flex;gap:8px;background:#0a1019;padding:5px;border:1px solid var(--line);border-radius:13px;margin:14px 0}.demo-switch button{flex:1;background:transparent;color:#8d99ad;padding:9px;border-radius:9px}.demo-switch button.active{background:#1b2231;color:#fff}.login-note{color:#7e8aa0;font-size:12px;margin-top:14px}.mobile-menu{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;place-items:center;padding:18px}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#101621;border:1px solid var(--line);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.slip-preview{width:100%;max-height:360px;object-fit:contain;background:#080b12;border-radius:12px;border:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#151d2b;border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 16px;border-radius:13px;max-width:340px}.toast b{display:block}.menu-toggle{display:block}

/* ===== V2 MODERN UX ===== */
:root{--success:#20d6a1;--glass:rgba(255,255,255,.035)}
body.light{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fc;--line:#dce3ee;--text:#172033;--muted:#667085;--shadow:0 14px 35px rgba(35,48,75,.10);background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.10),transparent 60%),#f4f7fb}
body.light .sidebar,body.light .topbar{background:rgba(255,255,255,.88)}
body.light .card{background:linear-gradient(180deg,#fff,#f9fbfe)}
body.light .field input,body.light .field select,body.light .field textarea,body.light .iconbtn,body.light .btn{background:#fff;color:var(--text)}
body.light .table th,body.light .table td{border-color:#e8edf4}
body.light .notice{background:#f8fafd}
body.light .drawbox{background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.12),transparent 55%),#f8faff}
body.light .nav button{color:#667085}
body.light .nav button:hover,body.light .nav button.active{background:#eef1f8;color:#172033}
.theme-icon{font-size:17px}
.sidebar{transition:transform .22s ease}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(3px)}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.money-card{position:relative;overflow:hidden}
.money-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:rgba(124,92,255,.10)}
.money-card .num{font-size:28px}
.financial-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.progress{height:7px;background:#1d2636;border-radius:99px;overflow:hidden;margin-top:10px}
body.light .progress{background:#e7ecf4}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--success));border-radius:99px}
.locked{opacity:.62}
.locked-badge{color:#ff8796;background:rgba(255,102,120,.10);border:1px solid rgba(255,102,120,.2);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.winner-list{display:grid;gap:9px}
.winner-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass)}
.menu-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:15px 12px 5px}
@media(max-width:1050px){.financial-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.financial-grid{grid-template-columns:1fr}}

body.amharic{font-family:"Noto Sans Ethiopic","Noto Sans",Arial,sans-serif}
body.amharic .num,body.amharic input[type=number]{font-family:Arial,"Noto Sans Ethiopic",sans-serif}
body.amharic .eyebrow{letter-spacing:.03em}
.lang-btn{min-width:92px}
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand"><div class="logo">E</div><div><b>EqubFlow</b><small>Modern Equb Management</small></div></div>
    <div class="eyebrow">Local prototype</div>
    <h2 style="margin:5px 0">Sign in to continue</h2>
    <p style="color:var(--muted)">No Firebase yet. Everything in this prototype is stored locally in this browser.</p>
    <div class="demo-switch"><button id="adminTab" class="active" onclick="setLoginRole('admin')">👑 Super Admin</button><button id="userTab" onclick="setLoginRole('user')">👤 Member</button></div>
    <div id="loginForm"></div>
    <div class="login-note">Demo credentials are only for testing the local UI.</div>
  </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo">E</div><div><b>EqubFlow</b><small id="brandSub">Super Admin</small></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot"><div class="user-mini"><div class="avatar" id="miniAvatar">SA</div><div><b id="miniName">Super Admin</b><small id="miniRole" style="display:block;color:var(--muted)">Administrator</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn menu-toggle" onclick="toggleSidebar()">☰</button><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button id="langBtn" class="btn lang-btn" onclick="toggleLanguage()">አማርኛ</button><button class="iconbtn" title="Toggle theme" onclick="toggleTheme()"><span id="themeIcon" class="theme-icon">☾</span></button><button class="iconbtn" onclick="showNotifications()">🔔<span id="notifDot"></span></button><button class="btn" onclick="logout()">Logout</button></div></header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='equbflow_local_v3';
const initial=()=>({settings:{org:'Unity Equb',weeklyAmount:1000,cycle:1,due:'Friday',equbStatus:'active',equbEndDate:'',currency:'ETB',theme:'dark',lang:'en'},members:Array.from({length:12},(_,i)=>({id:'M'+String(i+1).padStart(3,'0'),name:['Abebe Kebede','Hana Ali','Dawit Tesfaye','Mekdes Girma','Yonas Bekele','Selamawit Tadesse','Biruk Alemu','Rahel Worku','Natnael Desta','Mimi Ahmed','Samuel Getachew','Liya Mohammed'][i],phone:'09'+String(10000000+i),active:true})),payments:[],notifications:[],draws:[]});
let db=JSON.parse(localStorage.getItem(KEY)||'null')||initial();
let session=null, loginRole='admin', page='dashboard';

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return Number(n||0).toLocaleString()+' ETB'}
function now(){return new Date().toLocaleString()}
function member(id){return db.members.find(x=>x.id===id)}
function paymentFor(mid){return db.payments.find(p=>p.memberId===mid&&p.cycle===db.settings.cycle)}
function statusBadge(s){let c=s==='paid'?'paid':s==='rejected'?'rejected':s==='pending'?'pending':'neutral';let t=s==='paid'?'Paid':s==='rejected'?'Rejected':s==='pending'?'Waiting':'Not submitted';return `<span class="badge ${c}">${s==='paid'?'●':s==='rejected'?'●':'●'} ${t}</span>`}
function addNotif(target,title,message,type='info'){db.notifications.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),target,title,message,type,read:false,createdAt:Date.now()});save()}
function toast(title,msg){const t=document.getElementById('toast');t.innerHTML='<b>'+esc(title)+'</b><span style="color:var(--muted)">'+esc(msg)+'</span>';t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),3200)}

function trText(s){return AM[s]||s}

function translateVisibleUI(){
 if((db.settings.lang||'en')!=='am')return;
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode()) nodes.push(walker.currentNode);
 nodes.forEach(n=>{
   const s=n.nodeValue.trim();
   if(AM[s]) n.nodeValue=n.nodeValue.replace(s,AM[s]);
 });
}

function applyLanguage(){
  const lang=db.settings.lang||'en';
  document.body.classList.toggle('amharic',lang==='am');
  document.documentElement.lang=lang==='am'?'am':'en';
  document.documentElement.dir='ltr';
  const b=document.getElementById('langBtn');
  if(b)b.textContent=lang==='am'?'English':'አማርኛ';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=lang==='am'?trText(el.dataset.i18n):el.dataset.i18n}); if(lang==='am') setTimeout(translateVisibleUI,0);
}
function toggleLanguage(){
  db.settings.lang=(db.settings.lang||'en')==='en'?'am':'en';
  save(); render(); applyLanguage();
}

function applyTheme(){
  const t=db.settings.theme||'dark';
  document.body.classList.toggle('light',t==='light');
  const icon=document.getElementById('themeIcon'); if(icon) icon.textContent=t==='light'?'☀':'☾';
}
function toggleTheme(){
  db.settings.theme=(db.settings.theme||'dark')==='dark'?'light':'dark';
  save(); applyTheme();
}
function activeMembers(){return db.members.filter(m=>m.active)}
function cyclePayments(){return db.payments.filter(p=>p.cycle===db.settings.cycle)}
function confirmedTotal(){return cyclePayments().filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function allConfirmedTotal(){return db.payments.filter(p=>p.status==='paid').reduce((a,p)=>a+Number(p.amount||0),0)}
function expectedTotal(){return activeMembers().length*Number(db.settings.weeklyAmount||0)}
function pendingTotal(){return cyclePayments().filter(p=>p.status==='pending').reduce((a,p)=>a+Number(p.amount||0),0)}
function winnerLocked(id){return (db.draws||[]).some(d=>d.memberId===id && d.lockedUntilEqubEnd)}
function eligibleDrawMembers(){
  return activeMembers().filter(m=>paymentFor(m.id)?.status==='paid'&&!winnerLocked(m.id));
}
function drawLockedWinners(){
  return (db.draws||[]).filter(d=>d.lockedUntilEqubEnd);
}
function checkEqubEnd(){
  if(db.settings.equbEndDate && new Date(db.settings.equbEndDate+'T23:59:59')<new Date() && db.settings.equbStatus==='active'){
    db.settings.equbStatus='ended'; save();
  }
}
function startNewEqub(){
  db.settings.equbStatus='active';
  db.settings.equbEndDate='';
  db.draws=(db.draws||[]).filter(d=>!d.lockedUntilEqubEnd);
  save(); render(); toast('New Equb started','Previous winner locks have been cleared.');
}

function runDraw(){
 checkEqubEnd();
 if(db.settings.equbStatus!=='active')return toast('Equb ended','Start a new Equb before running another draw.');
 const eligible=eligibleDrawMembers();
 if(!eligible.length)return toast('No eligible members','Only Paid members who have never won in this Equb can be selected.');
 const num=document.getElementById('drawNum'),win=document.getElementById('drawWinner');
 let i=0;
 const timer=setInterval(()=>{
   num.textContent=String(Math.floor(Math.random()*100)+1).padStart(2,'0');
   if(++i>24){
     clearInterval(timer);
     const arr=new Uint32Array(1); crypto.getRandomValues(arr);
     const m=eligible[arr[0]%eligible.length];
     num.textContent=m.id.replace('M','');
     win.textContent='🏆 '+m.name+' — '+m.id;
     db.draws.unshift({memberId:m.id,name:m.name,cycle:db.settings.cycle,at:now(),lockedUntilEqubEnd:true});
     addNotif('admin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+db.settings.cycle+'. Winner is locked until the Equb ends.','success');
     addNotif(m.id,'You won the Equb draw','Congratulations! You won today’s draw. You are locked from future draws until this Equb ends.','success');
     save();
     toast('Draw complete',m.name+' is now locked and cannot be selected again in this Equb.');
     setTimeout(render,500);
   }
 },75);
}

function markAllRead(){db.notifications.filter(n=>n.target===(session.role==='admin'?'admin':session.id)).forEach(n=>n.read=true);save();render()}
function showNotifications(){go('notifications')}
function saveSettings(){db.settings.org=document.getElementById('sorg').value.trim()||'Unity Equb';db.settings.weeklyAmount=Number(document.getElementById('samt').value)||1000;db.settings.cycle=Number(document.getElementById('scycle').value)||1;db.settings.due=document.getElementById('sdue').value.trim()||'Friday';db.settings.equbEndDate=document.getElementById('send').value||'';db.settings.equbStatus=document.getElementById('sstatus').value;db.settings.lang=document.getElementById('slang').value;save();checkEqubEnd();applyTheme();render();toast('Saved','Settings updated locally.')}
function resetDemo(){if(!confirm('Reset all local Equb data?'))return;db=initial();save();session=null;location.reload()}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
renderLoginForm();
</script>
