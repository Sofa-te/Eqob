<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EqubFlow — Local Prototype</title>
<meta name="theme-color" content="#0b0f19">
<style>
:root{--bg:#080b12;--panel:#101521;--panel2:#151b29;--line:#232c3d;--text:#eef3fb;--muted:#8e9ab0;--accent:#7c5cff;--accent2:#20d6a1;--warn:#f7b955;--danger:#ff6678;--shadow:0 18px 50px rgba(0,0,0,.28);--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.16),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(32,214,161,.08),transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh;display:flex}.sidebar{width:260px;background:rgba(10,14,23,.92);border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9d87ff);font-weight:900;box-shadow:0 10px 30px rgba(124,92,255,.3)}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb9cc;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#171d2b;color:#fff}.nav .ico{width:22px;text-align:center}.sidebar-foot{position:absolute;bottom:18px;left:18px;right:18px}.user-mini{border:1px solid var(--line);background:#0e141f;padding:12px;border-radius:14px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#20283a;color:#fff;font-weight:800}.main{margin-left:260px;width:calc(100% - 260px);min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(8,11,18,.78);backdrop-filter:blur(18px);z-index:10}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:#121925;color:#eaf0f8;border-radius:12px;padding:10px 13px}.iconbtn{width:42px;height:42px;padding:0}.btn.primary{background:linear-gradient(135deg,var(--accent),#6546e9);border-color:transparent}.btn.success{background:rgba(32,214,161,.13);color:#5ff0c5;border-color:rgba(32,214,161,.3)}.btn.danger{background:rgba(255,102,120,.12);color:#ff8796;border-color:rgba(255,102,120,.28)}.btn.warn{background:rgba(247,185,85,.12);color:#ffd27c;border-color:rgba(247,185,85,.25)}.content{padding:28px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:#9d87ff;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:800}.hero h2{font-size:30px;line-height:1.15;margin:6px 0}.hero p{color:var(--muted);margin:0}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,rgba(18,24,37,.96),rgba(12,17,27,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat{min-height:125px}.stat .label{color:var(--muted);font-size:12px}.stat .num{font-size:30px;font-weight:850;margin:10px 0 4px}.stat .sub{color:#7e8aa0;font-size:12px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #202838;text-align:left;white-space:nowrap}.table th{color:#7f8ba0;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.paid{background:rgba(32,214,161,.11);color:#5ff0c5}.pending{background:rgba(247,185,85,.1);color:#ffd27c}.rejected{background:rgba(255,102,120,.1);color:#ff8796}.neutral{background:#1b2331;color:#aab5c7}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#8d99ad}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0b111b;color:#f2f6fc;border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6e55dd;box-shadow:0 0 0 3px rgba(124,92,255,.12)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.search{flex:1;min-width:180px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.notice-list{display:grid;gap:10px}.notice{border:1px solid var(--line);background:#0d131e;padding:13px;border-radius:14px}.notice.unread{border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.06)}.notice b{display:block}.notice small{color:var(--muted)}.drawbox{text-align:center;padding:34px;border-radius:20px;background:radial-gradient(circle at 50% 20%,rgba(124,92,255,.22),transparent 55%),#0c121d;border:1px solid var(--line)}.drawnum{font-size:82px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:18px}.winner{font-size:20px;color:#5ff0c5;font-weight:850}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 20% 10%,rgba(124,92,255,.2),transparent 65%),var(--bg)}.login-card{width:min(470px,100%);padding:30px;border:1px solid var(--line);background:rgba(15,21,33,.94);border-radius:26px;box-shadow:var(--shadow)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.demo-switch{display:flex;gap:8px;background:#0a1019;padding:5px;border:1px solid var(--line);border-radius:13px;margin:14px 0}.demo-switch button{flex:1;background:transparent;color:#8d99ad;padding:9px;border-radius:9px}.demo-switch button.active{background:#1b2231;color:#fff}.login-note{color:#7e8aa0;font-size:12px;margin-top:14px}.mobile-menu{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:grid;place-items:center;padding:18px}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#101621;border:1px solid var(--line);border-radius:22px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.slip-preview{width:100%;max-height:360px;object-fit:contain;background:#080b12;border-radius:12px;border:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#151d2b;border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 16px;border-radius:13px;max-width:340px}.toast b{display:block}.menu-toggle{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.menu-toggle{display:block}.topbar{padding:0 16px}.content{padding:18px}}
@media(max-width:620px){.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}.topbar h1{font-size:17px}.content{padding:14px}.card{padding:15px}.drawnum{font-size:62px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand"><div class="logo">E</div><div><b>EqubFlow</b><small>Modern Equb Management</small></div></div>
    <div class="eyebrow">Local prototype</div>
    <h2 style="margin:5px 0">Sign in to continue</h2>
    <p style="color:var(--muted)">No Firebase yet. Everything in this prototype is stored locally in this browser.</p>
    <div class="demo-switch"><button id="adminTab" class="active" onclick="setLoginRole('admin')">👑 Super Admin</button><button id="userTab" onclick="setLoginRole('user')">👤 Member</button></div>
    <div id="loginForm"></div>
    <div class="login-note">Demo credentials are only for testing the local UI.</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand"><div class="logo">E</div><div><b>EqubFlow</b><small id="brandSub">Super Admin</small></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot"><div class="user-mini"><div class="avatar" id="miniAvatar">SA</div><div><b id="miniName">Super Admin</b><small id="miniRole" style="display:block;color:var(--muted)">Administrator</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn menu-toggle" onclick="toggleSidebar()">☰</button><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="iconbtn" onclick="showNotifications()">🔔<span id="notifDot"></span></button><button class="btn" onclick="logout()">Logout</button></div></header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='equbflow_local_v3';
const initial=()=>({settings:{org:'Unity Equb',weeklyAmount:1000,cycle:1,due:'Friday'},members:Array.from({length:12},(_,i)=>({id:'M'+String(i+1).padStart(3,'0'),name:['Abebe Kebede','Hana Ali','Dawit Tesfaye','Mekdes Girma','Yonas Bekele','Selamawit Tadesse','Biruk Alemu','Rahel Worku','Natnael Desta','Mimi Ahmed','Samuel Getachew','Liya Mohammed'][i],phone:'09'+String(10000000+i),active:true})),payments:[],notifications:[],draws:[]});
let db=JSON.parse(localStorage.getItem(KEY)||'null')||initial();
let session=null, loginRole='admin', page='dashboard';

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return Number(n||0).toLocaleString()+' ETB'}
function now(){return new Date().toLocaleString()}
function member(id){return db.members.find(x=>x.id===id)}
function paymentFor(mid){return db.payments.find(p=>p.memberId===mid&&p.cycle===db.settings.cycle)}
function statusBadge(s){let c=s==='paid'?'paid':s==='rejected'?'rejected':s==='pending'?'pending':'neutral';let t=s==='paid'?'Paid':s==='rejected'?'Rejected':s==='pending'?'Waiting':'Not submitted';return `<span class="badge ${c}">${s==='paid'?'●':s==='rejected'?'●':'●'} ${t}</span>`}
function addNotif(target,title,message,type='info'){db.notifications.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),target,title,message,type,read:false,createdAt:Date.now()});save()}
function toast(title,msg){const t=document.getElementById('toast');t.innerHTML='<b>'+esc(title)+'</b><span style="color:var(--muted)">'+esc(msg)+'</span>';t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),3200)}
function setLoginRole(r){loginRole=r;document.getElementById('adminTab').classList.toggle('active',r==='admin');document.getElementById('userTab').classList.toggle('active',r==='user');renderLoginForm()}
function renderLoginForm(){const el=document.getElementById('loginForm');if(loginRole==='admin'){el.innerHTML=`<div class="formgrid"><div class="field"><label>Email</label><input id="lemail" value="admin@equb.local"></div><div class="field"><label>Password</label><input id="lpass" type="password" value="admin123"></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="loginAdmin()">Sign in as Super Admin</button>`}else{el.innerHTML=`<div class="field"><label>Member</label><select id="lmember">${db.members.filter(m=>m.active).map(m=>`<option value="${m.id}">${esc(m.name)} — ${m.id}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Demo password</label><input id="luserpass" type="password" value="123456"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="loginUser()">Sign in as Member</button>`}}
function loginAdmin(){session={role:'admin',id:'ADMIN',name:'Super Admin'};startApp()}
function loginUser(){const id=document.getElementById('lmember').value;const m=member(id);if(!m)return;session={role:'user',id,name:m.name};startApp()}
function startApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');page=session.role==='admin'?'dashboard':'userDashboard';buildNav();render();toast('Welcome',session.name)}
function logout(){session=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');renderLoginForm()}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function buildNav(){const nav=document.getElementById('nav');const admin=[['dashboard','⌂','Dashboard'],['members','👥','Members'],['payments','💳','Payments'],['verification','✓','Verification'],['draw','🎰','Equb Draw'],['notifications','🔔','Notifications'],['reports','📊','Reports'],['settings','⚙','Settings']];const user=[['userDashboard','⌂','My Dashboard'],['myPayment','💳','Weekly Payment'],['history','📋','Payment History'],['notifications','🔔','Notifications'],['profile','👤','My Profile']];const arr=session.role==='admin'?admin:user;nav.innerHTML=arr.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('brandSub').textContent=session.role==='admin'?'Super Admin':'Member Portal';document.getElementById('miniName').textContent=session.name;document.getElementById('miniRole').textContent=session.role==='admin'?'Administrator':'Member';document.getElementById('miniAvatar').textContent=session.role==='admin'?'SA':session.name.split(' ').map(x=>x[0]).slice(0,2).join('')}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');buildNav();render()}
function render(){const titles={dashboard:'Dashboard',members:'Members',payments:'Payments',verification:'Verification',draw:'Equb Draw',notifications:'Notifications',reports:'Reports',settings:'Settings',userDashboard:'My Dashboard',myPayment:'Weekly Payment',history:'Payment History',profile:'My Profile'};document.getElementById('pageTitle').textContent=titles[page]||'EqubFlow';const c=document.getElementById('content');const fn=window['page_'+page];c.innerHTML=fn?fn():'';updateDot()}
function updateDot(){const n=db.notifications.filter(x=>x.target===(session.role==='admin'?'admin':session.id)&&!x.read).length;document.getElementById('notifDot').textContent=n?`<i style="position:absolute;background:var(--danger);width:8px;height:8px;border-radius:50%;margin:-25px 0 0 15px"></i>`:''}
function page_dashboard(){const paid=db.payments.filter(p=>p.cycle===db.settings.cycle&&p.status==='paid').length,pending=db.payments.filter(p=>p.cycle===db.settings.cycle&&p.status==='pending').length,total=db.members.filter(m=>m.active).length;return `<div class="hero"><div><div class="eyebrow">${esc(db.settings.org)}</div><h2>Good day, Super Admin</h2><p>Control members, payments, verification and the weekly draw from one place.</p></div><button class="btn primary" onclick="go('verification')">Review payments →</button></div><div class="grid stats"><div class="card stat"><span class="label">Active Members</span><div class="num">${total}</div><span class="sub">Maximum supported: 100</span></div><div class="card stat"><span class="label">Paid This Cycle</span><div class="num">${paid}</div><span class="sub">${money(paid*db.settings.weeklyAmount)}</span></div><div class="card stat"><span class="label">Waiting Review</span><div class="num">${pending}</div><span class="sub">Needs verification</span></div><div class="card stat"><span class="label">Current Cycle</span><div class="num">#${db.settings.cycle}</div><span class="sub">Due ${esc(db.settings.due)}</span></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><h3>Recent payments</h3><button class="btn" onclick="go('payments')">View all</button></div>${paymentRows(6)}</div><div class="card"><div class="section-head"><h3>Recent notifications</h3><button class="btn" onclick="go('notifications')">Open</button></div>${noticeRows(4,'admin')}</div></div>`}
function paymentRows(limit=10, filter=''){let ps=db.payments.filter(p=>!filter||p.status===filter).slice(0,limit);if(!ps.length)return '<div class="empty">No payment records yet.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Cycle</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(member(p.memberId)?.name||p.memberId)}<br><small style="color:var(--muted)">${p.memberId}</small></td><td>#${p.cycle}</td><td>${money(p.amount)}</td><td>${statusBadge(p.status)}</td><td><button class="btn" onclick="openPayment('${p.id}')">View</button></td></tr>`).join('')}</tbody></table></div>`}
function page_members(){return `<div class="hero"><div><div class="eyebrow">People</div><h2>Members</h2><p>Manage the 100-member Equb roster.</p></div><button class="btn primary" onclick="memberModal()">+ Add member</button></div><div class="card"><div class="toolbar"><input class="field input search" id="memberSearch" placeholder="Search name, phone or member ID..." oninput="filterMembers()"></div><div id="memberTable">${memberTable()}</div></div>`}
function memberTable(){const q=(document.getElementById('memberSearch')?.value||'').toLowerCase();let ms=db.members.filter(m=>[m.name,m.phone,m.id].join(' ').toLowerCase().includes(q));return `<div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Phone</th><th>This cycle</th><th>Status</th><th></th></tr></thead><tbody>${ms.map(m=>{const p=paymentFor(m.id);return `<tr><td><b>${esc(m.name)}</b><br><small style="color:var(--muted)">${m.id}</small></td><td>${esc(m.phone)}</td><td>${p?money(p.amount):money(db.settings.weeklyAmount)}</td><td>${statusBadge(p?.status||'none')}</td><td><button class="btn" onclick="memberModal('${m.id}')">Edit</button></td></tr>`}).join('')}</tbody></table></div>`}
function filterMembers(){document.getElementById('memberTable').innerHTML=memberTable()}
function page_payments(){return `<div class="hero"><div><div class="eyebrow">Money flow</div><h2>Payments</h2><p>All submitted payments for the current and previous cycles.</p></div><button class="btn primary" onclick="simulatePaymentModal()">+ Simulate submission</button></div><div class="card"><div class="toolbar"><button class="btn" onclick="render()">All</button><button class="btn warn" onclick="this.parentElement.parentElement.querySelector('#payRows').innerHTML=paymentRows(100,'pending')">Pending</button><button class="btn success" onclick="this.parentElement.parentElement.querySelector('#payRows').innerHTML=paymentRows(100,'paid')">Paid</button></div><div id="payRows">${paymentRows(100)}</div></div>`}
function page_verification(){const pending=db.payments.filter(p=>p.status==='pending');return `<div class="hero"><div><div class="eyebrow">Control</div><h2>Verification</h2><p>Review each submitted slip before marking the member as paid.</p></div></div><div class="card">${pending.length?paymentRows(100,'pending'):'<div class="empty">🎉 Nothing waiting for verification.</div>'}</div>`}
function page_draw(){const eligible=db.members.filter(m=>m.active&&paymentFor(m.id)?.status==='paid');return `<div class="hero"><div><div class="eyebrow">Weekly draw</div><h2>Equb Draw</h2><p>Only members marked Paid in cycle #${db.settings.cycle} are eligible in this local prototype.</p></div></div><div class="grid two"><div class="card drawbox"><div class="eyebrow">Eligible members: ${eligible.length}</div><div id="drawNum" class="drawnum">--</div><div id="drawWinner" class="winner">Ready for draw</div><button class="btn primary" style="margin-top:22px;padding:13px 28px" onclick="runDraw()">🎰 START DRAW</button></div><div class="card"><div class="section-head"><h3>Draw history</h3></div>${db.draws.length?db.draws.slice(0,10).map(d=>`<div class="notice"><b>🏆 #${d.memberId} — ${esc(d.name)}</b><small>Cycle #${d.cycle} · ${esc(d.at)}</small></div>`).join(''):'<div class="empty">No draws yet.</div>'}</div></div>`}
function page_notifications(){return `<div class="hero"><div><div class="eyebrow">Updates</div><h2>Notifications</h2><p>Local in-app notifications for ${session.role==='admin'?'the admin':'your account'}.</p></div><button class="btn" onclick="markAllRead()">Mark all read</button></div><div class="card">${noticeRows(100,session.role==='admin'?'admin':session.id,true)}</div>`}
function noticeRows(limit,target,full=false){let ns=db.notifications.filter(n=>n.target===target).slice(0,limit);if(!ns.length)return '<div class="empty">No notifications.</div>';return `<div class="notice-list">${ns.map(n=>`<div class="notice ${n.read?'':'unread'}" onclick="readNotif('${n.id}')"><b>${esc(n.title)}</b><div>${esc(n.message)}</div><small>${new Date(n.createdAt).toLocaleString()}</small></div>`).join('')}</div>`}
function page_reports(){const total=db.payments.filter(p=>p.cycle===db.settings.cycle&&p.status==='paid').reduce((a,p)=>a+p.amount,0);return `<div class="hero"><div><div class="eyebrow">Insights</div><h2>Reports</h2><p>Simple local reporting before the Firebase version.</p></div></div><div class="grid three"><div class="card stat"><span class="label">Collected</span><div class="num">${money(total)}</div><span class="sub">Cycle #${db.settings.cycle}</span></div><div class="card stat"><span class="label">Paid members</span><div class="num">${db.payments.filter(p=>p.cycle===db.settings.cycle&&p.status==='paid').length}</div><span class="sub">Verified</span></div><div class="card stat"><span class="label">Pending</span><div class="num">${db.payments.filter(p=>p.cycle===db.settings.cycle&&p.status==='pending').length}</div><span class="sub">Need review</span></div></div><div class="card" style="margin-top:16px"><div class="section-head"><h3>Member payment status</h3></div>${memberTable()}</div>`}
function page_settings(){return `<div class="hero"><div><div class="eyebrow">Configuration</div><h2>Settings</h2><p>Local settings only. Firebase is intentionally not connected.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Organization name</label><input id="sorg" value="${esc(db.settings.org)}"></div><div class="field"><label>Weekly amount (ETB)</label><input id="samt" type="number" value="${db.settings.weeklyAmount}"></div><div class="field"><label>Current cycle</label><input id="scycle" type="number" value="${db.settings.cycle}"></div><div class="field"><label>Payment deadline</label><input id="sdue" value="${esc(db.settings.due)}"></div></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn danger" onclick="resetDemo()">Reset local demo</button></div></div>`}
function userData(){return member(session.id)}
function page_userDashboard(){const m=userData(),p=paymentFor(m.id);return `<div class="hero"><div><div class="eyebrow">${esc(db.settings.org)} · Member ${m.id}</div><h2>Welcome, ${esc(m.name.split(' ')[0])} 👋</h2><p>Your weekly Equb account at a glance.</p></div><button class="btn primary" onclick="go('myPayment')">${p?.status==='paid'?'View payment':'Pay this week'} →</button></div><div class="grid stats"><div class="card stat"><span class="label">Weekly contribution</span><div class="num">${money(db.settings.weeklyAmount)}</div><span class="sub">Cycle #${db.settings.cycle}</span></div><div class="card stat"><span class="label">Current status</span><div class="num" style="font-size:21px;margin-top:16px">${statusBadge(p?.status||'none')}</div><span class="sub">${p?'Submitted '+new Date(p.submittedAt).toLocaleDateString():'No payment submitted'}</span></div><div class="card stat"><span class="label">Paid cycles</span><div class="num">${db.payments.filter(x=>x.memberId===m.id&&x.status==='paid').length}</div><span class="sub">Confirmed payments</span></div><div class="card stat"><span class="label">Notifications</span><div class="num">${db.notifications.filter(n=>n.target===m.id&&!n.read).length}</div><span class="sub">Unread updates</span></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><h3>This week's payment</h3></div>${userPaymentCard(p)}</div><div class="card"><div class="section-head"><h3>Recent updates</h3></div>${noticeRows(4,m.id)}</div></div>`}
function userPaymentCard(p){if(!p)return `<div class="empty">Your Week #${db.settings.cycle} contribution is ${money(db.settings.weeklyAmount)}.<br><button class="btn primary" style="margin-top:12px" onclick="go('myPayment')">Submit payment</button></div>`;return `<div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><b>Cycle #${p.cycle}</b><div style="color:var(--muted);margin-top:4px">${money(p.amount)} · ${p.bank||'Bank'}</div></div>${statusBadge(p.status)}</div><div style="margin-top:15px">${p.status==='rejected'?`<div class="notice"><b>Payment rejected</b><div>${esc(p.reason||'Please upload a new slip.')}</div></div><button class="btn primary" style="margin-top:12px" onclick="go('myPayment')">Upload new slip</button>`:p.status==='pending'?'<div class="notice">Your slip is waiting for Super Admin verification.</div>':'<div class="notice">Your payment has been confirmed. Thank you.</div>'}</div>`}
function page_myPayment(){const p=paymentFor(session.id);return `<div class="hero"><div><div class="eyebrow">Weekly contribution</div><h2>Payment for Cycle #${db.settings.cycle}</h2><p>Amount due: <b>${money(db.settings.weeklyAmount)}</b> · Deadline: ${esc(db.settings.due)}</p></div></div><div class="card">${p&&p.status==='paid'?`<div class="empty" style="color:#5ff0c5">✓ Payment already confirmed for this cycle.</div>`:paymentForm(p)}</div>`}
function paymentForm(p){return `<div class="formgrid"><div class="field"><label>Amount (ETB)</label><input id="pamount" type="number" value="${p?.amount||db.settings.weeklyAmount}"></div><div class="field"><label>Bank</label><select id="pbank"><option>Commercial Bank of Ethiopia</option><option>Awash Bank</option><option>Dashen Bank</option><option>Bank of Abyssinia</option><option>Other</option></select></div><div class="field"><label>Transaction / reference number</label><input id="pref" placeholder="e.g. TRX-123456"></div><div class="field"><label>Payment date</label><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field" style="margin-top:12px"><label>Bank payment slip (image)</label><input id="pslip" type="file" accept="image/*" onchange="previewSlip(event)"></div><div id="slipPreview" style="margin-top:12px"></div><button class="btn primary" style="margin-top:15px" onclick="submitPayment()">Submit payment for verification</button>`}
function page_history(){const ps=db.payments.filter(p=>p.memberId===session.id);return `<div class="hero"><div><div class="eyebrow">My records</div><h2>Payment History</h2><p>Only your own payment records are shown.</p></div></div><div class="card">${ps.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Cycle</th><th>Amount</th><th>Bank</th><th>Reference</th><th>Status</th></tr></thead><tbody>${ps.map(p=>`<tr><td>#${p.cycle}</td><td>${money(p.amount)}</td><td>${esc(p.bank||'-')}</td><td>${esc(p.ref||'-')}</td><td>${statusBadge(p.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payment history yet.</div>'}</div>`}
function page_profile(){const m=userData();return `<div class="hero"><div><div class="eyebrow">Account</div><h2>My Profile</h2><p>Your member information.</p></div></div><div class="card"><div class="formgrid"><div class="field"><label>Member ID</label><input value="${esc(m.id)}" disabled></div><div class="field"><label>Full name</label><input value="${esc(m.name)}" disabled></div><div class="field"><label>Phone</label><input value="${esc(m.phone)}" disabled></div><div class="field"><label>Status</label><input value="${m.active?'Active':'Inactive'}" disabled></div></div></div>`}

function memberModal(id){const m=id?member(id):{id:'',name:'',phone:'',active:true};openModal(`<div class="modal-head"><h3>${id?'Edit member':'Add member'}</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Member ID</label><input id="mid" value="${esc(m.id)}" ${id?'disabled':''} placeholder="M013"></div><div class="field"><label>Full name</label><input id="mname" value="${esc(m.name)}"></div><div class="field"><label>Phone</label><input id="mphone" value="${esc(m.phone)}"></div><div class="field"><label>Status</label><select id="mactive"><option value="true" ${m.active?'selected':''}>Active</option><option value="false" ${!m.active?'selected':''}>Inactive</option></select></div></div><button class="btn primary" style="margin-top:15px" onclick="saveMember('${id||''}')">Save member</button>`)}
function saveMember(id){const data={id:(document.getElementById('mid').value||'M'+String(db.members.length+1).padStart(3,'0')).toUpperCase(),name:document.getElementById('mname').value.trim(),phone:document.getElementById('mphone').value.trim(),active:document.getElementById('mactive').value==='true'};if(!data.name)return toast('Missing name','Enter the member name.');if(!id){if(db.members.length>=100)return toast('Limit reached','Maximum is 100 members.');db.members.push(data)}else Object.assign(member(id),data,{id});save();closeModal();render();toast('Saved','Member updated.')}
function simulatePaymentModal(){openModal(`<div class="modal-head"><h3>Simulate member submission</h3><button class="iconbtn" onclick="closeModal()">×</button></div><p style="color:var(--muted)">This is only for testing the admin workflow. In the final version the member uses the User Side payment form.</p><div class="field"><label>Member</label><select id="simMember">${db.members.filter(m=>m.active).map(m=>`<option value="${m.id}">${esc(m.name)} — ${m.id}</option>`).join('')}</select></div><button class="btn primary" style="margin-top:15px" onclick="simulatePayment()">Create pending payment</button>`)}
function simulatePayment(){const id=document.getElementById('simMember').value;if(paymentFor(id))return toast('Already submitted','This member already has a payment for this cycle.');const p={id:'P'+Date.now(),memberId:id,cycle:db.settings.cycle,amount:db.settings.weeklyAmount,bank:'Demo Bank',ref:'DEMO-'+Date.now(),paidAt:Date.now(),submittedAt:Date.now(),status:'pending',slipData:null};db.payments.unshift(p);addNotif('admin','New Payment Slip',member(id).name+' submitted a payment of '+money(p.amount)+' for Cycle #'+p.cycle+'.');save();closeModal();render();toast('Submitted','Payment is waiting for verification.')}
function submitPayment(){const m=userData(),amount=Number(document.getElementById('pamount').value),bank=document.getElementById('pbank').value,ref=document.getElementById('pref').value.trim(),date=document.getElementById('pdate').value,file=document.getElementById('pslip').files[0];if(!amount||!ref||!date)return toast('Incomplete','Please complete amount, reference and date.');if(!file)return toast('Slip required','Please select the bank slip image.');if(file.size>2*1024*1024)return toast('File too large','For this local prototype use an image under 2MB.');const reader=new FileReader();reader.onload=()=>{const old=paymentFor(m.id);if(old)db.payments=db.payments.filter(x=>x.id!==old.id);const p={id:'P'+Date.now(),memberId:m.id,cycle:db.settings.cycle,amount,bank,ref,paidAt:new Date(date).getTime(),submittedAt:Date.now(),status:'pending',slipData:reader.result};db.payments.unshift(p);addNotif('admin','New Payment Slip',m.name+' submitted a payment slip for '+money(amount)+'.');save();go('userDashboard');toast('Submitted','Your payment is waiting for verification.')};reader.readAsDataURL(file)}
function previewSlip(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById('slipPreview').innerHTML=`<img class="slip-preview" src="${r.result}" alt="Payment slip preview">`;r.readAsDataURL(f)}
function openPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;const m=member(p.memberId);openModal(`<div class="modal-head"><h3>Payment Review</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="grid two"><div><div class="notice"><b>${esc(m?.name||p.memberId)}</b><div>${p.memberId} · Cycle #${p.cycle}</div><div>${money(p.amount)} · ${esc(p.bank||'-')}</div><div>Ref: ${esc(p.ref||'-')}</div><div>Status: ${statusBadge(p.status)}</div></div>${p.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn success" onclick="verifyPayment('${p.id}')">✓ Confirm</button><button class="btn danger" onclick="rejectPayment('${p.id}')">✕ Reject</button></div>`:''}</div><div>${p.slipData?`<img class="slip-preview" src="${p.slipData}" alt="Bank slip">`:'<div class="empty">No real slip image in this record.</div>'}</div></div>`)}
function verifyPayment(id){const p=db.payments.find(x=>x.id===id);if(!p)return;p.status='paid';p.verifiedAt=Date.now();p.verifiedBy='ADMIN';addNotif(p.memberId,'Payment Confirmed','Your payment for Cycle #'+p.cycle+' has been confirmed.','success');save();closeModal();render();toast('Confirmed','Member is now Paid.')}
function rejectPayment(id){const reason=prompt('Reason for rejection:','Slip could not be verified.');if(reason===null)return;const p=db.payments.find(x=>x.id===id);if(!p)return;p.status='rejected';p.reason=reason||'Please upload a new slip.';addNotif(p.memberId,'Payment Rejected',p.reason,'danger');save();closeModal();render();toast('Rejected','Member was notified to upload again.')}
function runDraw(){const eligible=db.members.filter(m=>m.active&&paymentFor(m.id)?.status==='paid');if(!eligible.length)return toast('No eligible members','At least one Paid member is required.');const num=document.getElementById('drawNum'),win=document.getElementById('drawWinner');let i=0;const timer=setInterval(()=>{num.textContent=String(Math.floor(Math.random()*100)+1).padStart(2,'0');if(++i>22){clearInterval(timer);const arr=new Uint32Array(1);crypto.getRandomValues(arr);const m=eligible[arr[0]%eligible.length];num.textContent=m.id.replace('M','');win.textContent='🏆 '+m.name+' — '+m.id;db.draws.unshift({memberId:m.id,name:m.name,cycle:db.settings.cycle,at:now()});addNotif('admin','Draw completed','Winner: '+m.name+' ('+m.id+') for Cycle #'+db.settings.cycle,'success');save();toast('Draw complete','Winner selected from eligible Paid members.')}},75)}
function readNotif(id){const n=db.notifications.find(x=>x.id===id);if(n)n.read=true;save();render()}
function markAllRead(){db.notifications.filter(n=>n.target===(session.role==='admin'?'admin':session.id)).forEach(n=>n.read=true);save();render()}
function showNotifications(){go('notifications')}
function saveSettings(){db.settings.org=document.getElementById('sorg').value.trim()||'Unity Equb';db.settings.weeklyAmount=Number(document.getElementById('samt').value)||1000;db.settings.cycle=Number(document.getElementById('scycle').value)||1;db.settings.due=document.getElementById('sdue').value.trim()||'Friday';save();render();toast('Saved','Settings updated locally.')}
function resetDemo(){if(!confirm('Reset all local Equb data?'))return;db=initial();save();session=null;location.reload()}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
renderLoginForm();
</script>
</body>
</html>
